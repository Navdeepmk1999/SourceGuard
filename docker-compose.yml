# Orchestrates the two application services. Postgres and Redis are
# deliberately NOT defined here: this repo's local setup already runs them as
# standalone containers (`sourceguard-db`, a redis container) on the standard
# ports, and declaring them again would collide on 5432/6379 and risk a
# second, empty database shadowing the real one. The services below reach
# them over host.docker.internal instead; point DATABASE_URL / REDIS_URL at
# managed instances to run against those.

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    # Inherits Supabase / Groq / Together / LangSmith config from the same
    # file the local uvicorn run uses. Optional: `required: false` keeps
    # `docker compose up` working before .env exists.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Overrides any localhost value from .env - inside a container
      # "localhost" is the container itself, not the host running Postgres.
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@host.docker.internal:5432/sourceguard}
      REDIS_URL: ${REDIS_URL:-redis://host.docker.internal:6379/0}
      # The frontend container's origin must be allowed, alongside the
      # host-side dev server.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    extra_hosts:
      # Docker Desktop resolves host.docker.internal natively; on Linux this
      # mapping is what makes it resolve at all.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* are inlined at build time, so they are build args
        # rather than runtime environment.
        #
        # NEXT_PUBLIC_API_URL points at localhost, NOT http://backend:8000 -
        # this URL is fetched by the user's *browser*, which runs on the host
        # and cannot resolve compose service names. `backend` is only
        # reachable from inside the compose network.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
